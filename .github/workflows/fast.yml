name: Fast Debug (linux x86_64 single template_debug)
on:
  push:
    branches: ["*"]
  pull_request:
  workflow_dispatch:

jobs:
  fast:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup godot-cpp
        uses: ./godot-cpp/.github/actions/setup-godot-cpp
        with:
          platform: linux
          em-version: 3.1.62
          scons-version: "4.8.0"

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: fast-linux-x86_64-single
          max-size: 500M

      - name: Restore .scons_cache
        uses: ./godot-cpp/.github/actions/godot-cache-restore
        with:
          scons-cache: ${{ github.workspace }}/.scons-cache/
          cache-name: fast_linux_x86_64_single_template_debug_v4.7

      - name: Build (fast)
        shell: sh
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons-cache/
        run: |
          nproc=$(nproc)
          echo "Building with -j${nproc} (was -j2)"
          scons target=template_debug platform=linux arch=x86_64 precision=single api_version=4.7 -j${nproc}
          ccache -s || true

      - name: Save .scons_cache
        uses: ./godot-cpp/.github/actions/godot-cache-save
        with:
          scons-cache: ${{ github.workspace }}/.scons-cache/
          cache-name: fast_linux_x86_64_single_template_debug_v4.7

      - name: Verify .so in game/bin
        run: |
          ls -la game/bin/linux/ || echo "SCons copy may have failed, checking bin/"
          ls -la bin/linux/ || true

      - name: Setup Godot
        run: |
          wget -q -O /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -o /tmp/godot.zip -d /tmp/
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
          sudo ln -sf /tmp/Godot_v4.7.2-stable_linux.x86_64 /usr/bin/godot

      - name: Import Godot project
        run: godot --headless --path game/ --import --quit 2>&1 | tail -30 || true

      - name: Run headless tick harness
        run: godot --headless --path game/ --verbose -s tests/test_headless_tick.gd 2>&1 | tail -80

      - name: Run Phase 3 Trauma Team POC test
        run: |
          godot --headless --path game/ --verbose -s tests/test_phase3_trauma_team.gd 2>&1 | tail -80
